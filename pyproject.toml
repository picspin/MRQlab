[project]
name = "mrqlab"
version = "0.1.0"
description = "From spin to pixel: a teaching MRI simulator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/sequence-ir", "packages/physics", "packages/recon", "packages/mrqlab_experiment", "services/api"]
include = ["mrqlab_sequence*", "mrqlab_physics*", "mrqlab_recon*", "mrqlab_experiment*", "mrqlab_api*"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["packages/sequence-ir", "packages/physics", "packages/recon", "packages/mrqlab_experiment", "services/api"]
testpaths = ["tests"]

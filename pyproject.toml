[project]
name = "mrqlab"
version = "0.1.0"
description = "From spin to pixel: a teaching MRI simulator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2", "numpy>=1.26", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/sequence-ir", "packages/physics", "packages/recon", "packages/mrqlab_experiment", "services/api", "services/local_agent"]
include = ["mrqlab_sequence*", "mrqlab_physics*", "mrqlab_recon*", "mrqlab_experiment*", "mrqlab_api*", "mrqlab_agent*"]

[project.optional-dependencies]
# `hypothesis` powers the lease property/differential tests and `packaging` is
# their independent version-order oracle; both are declared explicitly so a
# clean `pip install -e '.[dev]'` can collect tests/local_agent. Without them the
# modules import a package that is not in the dependency set at all.
dev = ["pytest>=8", "httpx>=0.27", "hypothesis==6.170.17", "packaging>=23"]
noncartesian = ["finufft==2.5.0"]

[tool.pytest.ini_options]
pythonpath = ["packages/sequence-ir", "packages/physics", "packages/recon", "packages/mrqlab_experiment", "services/api", "services/local_agent"]
testpaths = ["tests"]
